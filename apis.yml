aid: ansun-biopharma
name: Ansun Biopharma
description: 'Ansun Biopharma is a privately held, clinical-stage biopharmaceutical
  company headquartered in the Sorrento Valley district of San Diego, California, founded
  in 2003 by virologists and molecular biologists and led by CEO Dr. Nancy Chang. Rather
  than targeting viruses directly, Ansun develops host-directed immuno-biologic therapies
  built on a recombinant sialidase platform. Its lead candidate, DAS181 (Ansun-181),
  is a multi-function sialidase fusion protein that removes the sialic acid receptors
  respiratory viruses use to enter host cells, and has been studied in parainfluenza
  virus (PIV), severe influenza, human metapneumovirus and COVID-19 in immunocompromised
  and hospitalized patients. The company also advances earlier-stage programs in oncology
  and autoimmune disease from the same sialidase platform. Ansun is a drug developer,
  not a software vendor: it publishes a corporate WordPress site covering its pipeline,
  research and technologies, publications, intellectual property, investors, news and
  careers, and exposes no public API, SDK, developer portal or machine-readable specification.'
